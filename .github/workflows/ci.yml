name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front # the React app's folder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint # the lint script from package.json
      - run: npm run build # the build script from package.json

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: back/go.mod # use the Go version from go.mod (1.26)
          cache-dependency-path: back/go.sum
      - run: go vet ./...
      - run: go build ./... # compile every package
      - run: go test ./... # run all tests

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend] # only build images if the code checks pass
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t passbook-api:ci back # which folder has the API's Dockerfile?
      - run: docker build -t passbook-web:ci front # and the web's?
