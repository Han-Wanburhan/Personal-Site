# Monitoring tools that run on passbook-ops (Jenkins is installed on the VM itself, not here).
# Start:  docker compose -f ops/docker-compose.yml up -d
name: ops

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped # comes back after a crash or a VM reboot
    ports:
      - "3001:3001" # web UI on http://192.168.1.44:3001
    volumes:
      - uptime-kuma:/app/data # monitors, history and your login survive updates

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d # keep 15 days of history
      - --storage.tsdb.retention.size=2GB # ...or less, if it ever reaches 2 GB
    ports:
      - "9090:9090" # web UI: http://192.168.1.44:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    depends_on:
      - prometheus
    env_file: .env # ops/.env: the admin password (NOT in git)
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false" # nobody can create their own account
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://192.168.1.44:3000
    ports:
      - "3000:3000" # http://192.168.1.44:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana # dashboards, users, alert rules survive restarts

volumes:
  uptime-kuma:
  prometheus:
  grafana:

    # the saved numbers survive restarts
