# Loaded by Grafana at start-up: Prometheus as the default data source.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy # Grafana's server calls Prometheus (not your browser)
    url: http://prometheus:9090 # service name: same compose network, no IP needed
    isDefault: true
    editable: false # change it here in git, not in the UI
